org.gradle.jvmargs=-Xmx1g
# Comma-separated Minecraft versions to verify; each must exist under harness.serverRoot.
harness.versions=1.8.8,1.17.1,1.20.6,26.2
# A directory holding one folder per version with that version's Paper server jar (and libraries/ from 1.18).
harness.serverRoot=../../core/Slimefun5/core/run
# Slimefun's core build folder: the newest Slimefun jar in libs/, and every manifest addon's jar that core's
# addon build left in addons-src/<repository>/build/libs/. -Pharness.plugins=<jar,...> loads only those jars.
harness.slimefunBuild=../../core/Slimefun5/core/build
harness.manifest=../manifest/addons.json
# The H2 jar core would otherwise download on every run into the wiped plugins/Slimefun/libraries/.
harness.storageDriver=../../core/Slimefun5/core/run/1.8.8/plugins/Slimefun/libraries/h2-2.1.214.jar
